name: Cleanup temporary importer data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Remove temporary bundle chunks
        run: |
          rm -rf .github/bootstrap-data .github/bootstrap-data-v2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/bootstrap-data .github/bootstrap-data-v2
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove temporary importer data"
          git push origin HEAD:main
