name: Import final v0.1.0 branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -f /tmp/adi-final.b64
      - name: Bundle chunk 1
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 2
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 3
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 4
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 5
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 6
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 7
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 8
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 9
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 10
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 11
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 12
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 13
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Bundle chunk 14
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi-final.b64
      - name: Import verified Git bundle
        run: |
          base64 -d /tmp/adi-final.b64 > /tmp/adi-final.bundle
          git bundle verify /tmp/adi-final.bundle
          git fetch /tmp/adi-final.bundle refs/heads/publish/v0.1.0:refs/remotes/bundle/publish-v0.1.0
          git push origin refs/remotes/bundle/publish-v0.1.0:refs/heads/publish/v0.1.0
