name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.8"
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api pytest -q
      - run: uv run --project apps/api ruff check apps/api/src apps/api/tests evaluation
      - run: uv run --project apps/api ruff format --check apps/api/src apps/api/tests evaluation
      - run: uv run --project apps/api mypy apps/api/src
      - run: uv run --project apps/api python evaluation/run.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.8.8"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --project ../api --frozen
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: product-screenshot
          path: apps/web/test-results/main-screen.png
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach
      - run: curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/api/health
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
