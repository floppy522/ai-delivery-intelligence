name: Bootstrap repository
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  import-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rm -f /tmp/adi.b64
      - name: Bundle chunk 1
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Bundle chunk 2
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Bundle chunk 3
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Bundle chunk 4
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Bundle chunk 5
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Bundle chunk 6
        env:
          DATA: 
        run: printf '%s' "$DATA" >> /tmp/adi.b64
      - name: Import verified Git bundle
        run: |
          base64 -d /tmp/adi.b64 > /tmp/adi.bundle
          git bundle verify /tmp/adi.bundle
          git fetch /tmp/adi.bundle refs/heads/main:refs/remotes/bundle/main refs/heads/feat/v0.1.0:refs/remotes/bundle/feat/v0.1.0
          git push origin refs/remotes/bundle/feat/v0.1.0:refs/heads/feat/v0.1.0
          git push origin refs/remotes/bundle/main:refs/heads/main --force
